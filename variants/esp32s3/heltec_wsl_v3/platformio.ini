[env:heltec-wsl-v3]
custom_meshtastic_hw_model = 44
custom_meshtastic_hw_model_slug = HELTEC_WSL_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec Wireless Stick Lite V3
custom_meshtastic_images = heltec-wsl-v3.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_partition_scheme = 8MB
 
extends = esp32s3_base
board_level = release
board = heltec_wifi_lora_32_V3
board_build.partitions = default_8MB.csv
# Temporary until espressif creates a release with this new target
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_WSL_V3
  -I variants/esp32s3/heltec_wsl_v3

; Smartlab LoRa: S.O.S. router (open access point + captive portal), Bluetooth and Meshtastic web server off.
[env:heltec-wsl-v3-sos]
extends = env:heltec-wsl-v3
custom_smartlab_profile = sos
build_flags =
  ${env:heltec-wsl-v3.build_flags}
  -D SMARTLAB_SOS_ROUTER=1
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1

; Smartlab LoRa: Backbone (high repeater between neighbourhoods), router role, no emergency Wi-Fi.
[env:heltec-wsl-v3-backbone]
extends = env:heltec-wsl-v3
custom_smartlab_profile = backbone

; Smartlab LoRa: B.O.B. on the Stick Lite (no GPS: the app supplies the phone position).
[env:heltec-wsl-v3-bob]
extends = env:heltec-wsl-v3
custom_smartlab_profile = bob
